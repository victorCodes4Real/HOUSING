<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="inside.css">
</head>
<body>
    <div class="cover">

    <div class="left">
      <div id="login">
        <input type="text" placeholder="Email" id="email">
        <input type="password" placeholder="Password" id="password">
        <input type="button" value="LOGIN" id="login-button">
        <a href="#">Forgot Password?</a>
        <hr style="width: 95%">
        <input type="button" value="Create New Account" id="create-new-account">
        <div id="login-error" style="color: red;"></div>
                    </div>
    </div>

  <div class="right">
    <!--right side content-->
    <div class="right-box">


             <div class="image-swap">
            </div>


            <div class="card-content">
            <p class="price-line">
                    <img class="iconz-naira" src="/iconz/naira.png" alt="naira">    
                     <span class="money">800,000,000</span>
                <img class="price-line-love" src="/iconz/love.png" alt="love">
                </p>
                <p class="bed-line">
                     <span class="bed1">6</span>
                   <img class="iconz-bed" src="/iconz/bed.png" alt="bed"> 
                     <span class="bed2">Bed</span>
                     
            
                <span class="bath1">7</span>
                <img class="iconz-bath" src="/iconz/bath.png" alt="bath">
                <span class="bath2">Bath</span>
                </p>
               <hr style="margin-left: 40px; margin-right: 40px; margin-top: 40px; color: silver;">
            <a href="" class="btn" >See More</a>
        </div>
        </div>
   </div>

   </div>

<script>
document.getElementById('login-button').onclick = async function () {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorDiv = document.getElementById('login-error');
  errorDiv.textContent = "";

  if (!email || !password){
    errorDiv.textContent = "Please enter both email and password.";
    return;
  }

  const res = await fetch('/login', {
     method: 'POST',
     headers: {'Content-Type': 'application/json'},
     body: JSON.stringify({email, password})
  });
  const data = await res.json();
  if (data.success) {
    window.location.href = '/index.html';
  } else if (data.reason === 'not_registered'){
    window.location.href ='/signup.html';
  } else {
    errorDiv.textContent = data.message || "Login failed.";
  }
};
  document.getElementById('create-new-account').onclick = function (){
    window.location.href = '/signup.html';
  };
</script>
</body>
</html>
